[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hermes-life"
version = "0.2.0"
description = "Hermes Life phase 2 backend"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2,<3"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["hermes_life*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
